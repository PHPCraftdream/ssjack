name: Feature CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: feature-${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ci:full]') && 'full' || 'scoped' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impacted:
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[ci:full]')) }}
    name: Scoped Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CGO_ENABLED: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify selection regressions
        shell: bash
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Select impacted packages
        id: scope
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci/plan.py plan --base "$BASE" --output "$RUNNER_TEMP/ci-plan.json"
      - name: Test selected packages (race detector on Linux)
        shell: bash
        run: python3 scripts/ci/plan.py test --output "$RUNNER_TEMP/ci-plan.json"
      - name: Native owner with production KDF
        if: steps.scope.outputs.nativeowner == 'true'
        shell: bash
        env:
          SSJACK_TEST_FULL_KDF: '1'
        run: |
          set -o pipefail
          go test -v -mod=readonly -p 1 -run '^TestNativeOwnerFullProfile$' -count=1 -timeout 600s ./internal/nativeownercheck | tee "$RUNNER_TEMP/native-owner.log"
          grep -q '^--- PASS: TestNativeOwnerFullProfile ' "$RUNNER_TEMP/native-owner.log"
      - name: Native owner CLI helper with production KDF
        if: steps.scope.outputs.appstorecli == 'true'
        shell: bash
        env:
          SSJACK_TEST_FULL_KDF: '1'
        run: |
          set -o pipefail
          go test -v -mod=readonly -p 1 -run '^(TestVaultOwnerControlFullProfile|TestVaultKeeperLifetimeFullProfile)$' -count=1 -timeout 300s ./cmd/ssjack | tee "$RUNNER_TEMP/native-owner-cli.log"
          grep -q '^--- PASS: TestVaultOwnerControlFullProfile ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q '^--- PASS: TestVaultKeeperLifetimeFullProfile ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q '^    --- PASS: TestVaultKeeperLifetimeFullProfile/directory ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q '^    --- PASS: TestVaultKeeperLifetimeFullProfile/legacy ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q '^    --- PASS: TestVaultOwnerControlFullProfile/native-command-helper ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q '^    --- PASS: TestVaultOwnerControlFullProfile/actual-keeper-process ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q -- '--- PASS: TestVaultOwnerControlFullProfile/actual-keeper-process/edit/native-mcp-guard ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q -- '--- PASS: TestVaultOwnerControlFullProfile/actual-keeper-process/restart/native-mcp-guard ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q -- '--- PASS: TestVaultOwnerControlFullProfile/actual-keeper-process/edit/native-interactive-helper ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q -- '--- PASS: TestVaultOwnerControlFullProfile/actual-keeper-process/edit/native-human-ssh ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q -- '--- PASS: TestVaultOwnerControlFullProfile/actual-keeper-process/edit/native-human-ssh/legacy-writer-refusal ' "$RUNNER_TEMP/native-owner-cli.log"
      - name: Native output-filter bypass with production KDF
        if: steps.scope.outputs.appstorecli == 'true'
        shell: bash
        env:
          SSJACK_TEST_FULL_KDF: '1'
        run: |
          set -o pipefail
          go test -v -mod=readonly -p 1 -run '^TestVaultOutputFilterFullProfile$' -count=1 -timeout 300s ./cmd/ssjack | tee "$RUNNER_TEMP/native-output-filter.log"
          grep -q '^--- PASS: TestVaultOutputFilterFullProfile ' "$RUNNER_TEMP/native-output-filter.log"
          grep -q -- '--- PASS: TestVaultOutputFilterFullProfile/bypass/native-mcp-guard ' "$RUNNER_TEMP/native-output-filter.log"
          grep -q -- '--- PASS: TestVaultOutputFilterFullProfile/bypass/native-human-ssh ' "$RUNNER_TEMP/native-output-filter.log"
      - name: Native selected owner archive with production KDF
        if: steps.scope.outputs.appstorecli == 'true'
        shell: bash
        env:
          SSJACK_TEST_FULL_KDF: '1'
        run: |
          set -o pipefail
          go test -v -mod=readonly -p 1 -run '^TestVaultOwnerArchiveFullProfile$' -count=1 -timeout 600s ./cmd/ssjack | tee "$RUNNER_TEMP/native-owner-archive.log"
          grep -q '^--- PASS: TestVaultOwnerArchiveFullProfile ' "$RUNNER_TEMP/native-owner-archive.log"
      - name: Text owner startup with production KDF
        if: runner.os == 'Linux' && steps.scope.outputs.appstorecli == 'true'
        shell: bash
        env:
          SSJACK_TEST_FULL_KDF: '1'
        run: |
          set -o pipefail
          go test -v -mod=readonly -p 1 -run '^TestVaultTextOwnerFullProfile$' -count=1 -timeout 180s ./cmd/ssjack | tee "$RUNNER_TEMP/text-owner.log"
          grep -q '^--- PASS: TestVaultTextOwnerFullProfile ' "$RUNNER_TEMP/text-owner.log"
      - name: Scoped app-store CLI acceptance (Linux private overlay)
        if: runner.os == 'Linux' && steps.scope.outputs.appstorecli == 'true'
        shell: bash
        run: python3 scripts/ci/appstore_scoped.py
      - name: Build changed installer fixture
        if: steps.scope.outputs.installers == 'true'
        shell: bash
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/ssjack-install-fixture$suffix" ./tests/fixtures/installbinary
          bash -n install.sh build.sh tests/installers.sh tests/installers-local.sh
      - name: Test changed Unix installer
        if: steps.scope.outputs.installers == 'true' && runner.os != 'Windows'
        shell: bash
        run: bash tests/installers.sh "$RUNNER_TEMP/ssjack-install-fixture"
      - name: Test changed Windows PowerShell installer
        if: steps.scope.outputs.installers == 'true' && runner.os == 'Windows'
        shell: powershell
        run: .\tests\installers.ps1 -Fixture (Join-Path $env:RUNNER_TEMP 'ssjack-install-fixture.exe')
      - name: Test changed PowerShell Core installer
        if: steps.scope.outputs.installers == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: .\tests\installers.ps1 -Fixture (Join-Path $env:RUNNER_TEMP 'ssjack-install-fixture.exe')
      - name: Build and install changed source on Linux or macOS
        if: steps.scope.outputs.installers == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          sh ./build.sh --install-dir "$RUNNER_TEMP/native source install"
          identity="$("$RUNNER_TEMP/native source install/ssjack" --version)"
          printf '%s\n' "$identity"
          case "$identity" in *"$(git rev-parse HEAD)"*) ;; *) exit 1 ;; esac
      - name: Build and install changed source with Windows PowerShell
        if: steps.scope.outputs.installers == 'true' && runner.os == 'Windows'
        shell: powershell
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'native source install classic'
          .\build.ps1 -InstallDir $prefix -NoPathUpdate
          $identity = & (Join-Path $prefix 'ssjack.exe') --version
          if ($LASTEXITCODE -ne 0 -or $identity -notlike "*$(git rev-parse HEAD)*") { throw 'Source install identity mismatch' }
      - name: Build and install changed source with PowerShell Core
        if: steps.scope.outputs.installers == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'native source install core'
          .\build.ps1 -InstallDir $prefix -NoPathUpdate
          $identity = & (Join-Path $prefix 'ssjack.exe') --version
          if ($LASTEXITCODE -ne 0 -or $identity -notlike "*$(git rev-parse HEAD)*") { throw 'Source install identity mismatch' }
      - name: Retain selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-selection-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/ci-plan.json
          if-no-files-found: warn
          retention-days: 7

  declarative-synthetic:
    name: Root-isolated synthetic authority acceptance
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[ci:full]')) }}
    runs-on: ubuntu-latest
    container: golang:1.26.0
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install CI orchestration interpreter
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3
      - name: Select impacted packages
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci/plan.py plan --base "$BASE" --output "$RUNNER_TEMP/declarative-plan.json"
      - name: Build CLI and exercise real root-provisioned scope
        if: steps.scope.outputs.declarative == 'true'
        shell: bash
        run: |
          go build -mod=readonly -trimpath -o /tmp/ssjack ./cmd/ssjack
          python3 scripts/ci/declarative_scoped.py /tmp/ssjack "$GITHUB_WORKSPACE"
      - name: Connected text-adapter acceptance
        if: steps.scope.outputs.declarative == 'true' || steps.scope.outputs.appstorecli == 'true'
        shell: bash
        run: python3 scripts/ci/text_adapter_scoped.py
      - name: Public confidential-delivery acceptance
        if: steps.scope.outputs.declarative == 'true' || steps.scope.outputs.appstorecli == 'true'
        shell: bash
        run: python3 scripts/ci/delivery_scoped.py

  full:
    name: Explicit full sprint gate
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ci:full]') }}
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ github.sha }}

  licenses:
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[ci:full]')) }}
    name: License policy audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise fail-closed audit rejection cases
        run: python3 -m unittest discover -s scripts -p 'test_check_licenses.py'
      - name: Check exact release dependency and notice policy (factual source consistency only)
        run: python3 scripts/check_licenses.py

  text-pair:
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[ci:full]')) }}
    uses: ./.github/workflows/text-pair.yml
    with:
      source_ref: ${{ github.sha }}
