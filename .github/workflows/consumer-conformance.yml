name: Consumer conformance

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing ssjack source to verify
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      source_ref:
        description: Existing ssjack source to verify
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  conformance:
    name: Synthetic consumer keeper SSH round trip
    runs-on: ubuntu-latest
    container: golang:1.26.0
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare isolated orchestration dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Require the synthetic consumer and private keeper round trip
        run: python3 scripts/ci/consumer_conformance.py --synthetic
