name: Release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (v1.2.3 or v1.2.3-prerelease)
        required: true
        type: string
      publish:
        description: Publish a new GitHub Release after checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: refs/tags/${{ inputs.tag }}

  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, suffix: ''}
          - {os: linux, arch: arm64, suffix: ''}
          - {os: darwin, arch: amd64, suffix: ''}
          - {os: darwin, arch: arm64, suffix: ''}
          - {os: windows, arch: amd64, suffix: '.exe'}
          - {os: windows, arch: arm64, suffix: '.exe'}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p dist
          go build -mod=readonly -trimpath -o "dist/ssjack_${GOOS}_${GOARCH}${SUFFIX}" ./cmd/ssjack
      - uses: actions/upload-artifact@v4
        with:
          name: ssjack-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/ssjack_*
          if-no-files-found: error
          retention-days: 7

  bundle:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ssjack-*
          merge-multiple: true
          path: assets
      - name: Verify asset set and generate checksums
        run: |
          cd assets
          for asset in ssjack_linux_amd64 ssjack_linux_arm64 ssjack_darwin_amd64 ssjack_darwin_arm64 ssjack_windows_amd64.exe ssjack_windows_arm64.exe; do
            test -f "$asset"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          LC_ALL=C sha256sum ssjack_* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ inputs.publish }}
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Publish a new release for an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace assets.' >&2
            exit 1
          fi
          printf '%s\n' 'Native ssjack binaries for Linux, macOS, and Windows (amd64/arm64).' 'Verify downloads against SHA256SUMS. This release does not include credentials or runtime files.' > notes.txt
          args=()
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" assets/* --verify-tag --title "$TAG" --notes-file notes.txt "${args[@]}"
