name: Full sprint CI

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing ref to verify at sprint completion
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      source_ref:
        description: Existing ref to verify
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        shell: bash
        run: |
          files="$(gofmt -l licenses.go licenses_test.go cmd internal plugins/ssjack-ui tests/fixtures)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Build CLI and check help
        shell: bash
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          binary="$RUNNER_TEMP/ssjack$suffix"
          revision="$(git rev-parse HEAD)"
          go build -mod=readonly -trimpath -ldflags "-X github.com/PHPCraftdream/ssjack/internal/buildinfo.Commit=$revision" -o "$binary" ./cmd/ssjack
          "$binary" --help
          identity="$("$binary" --version)"
          echo "$identity"
          case "$identity" in *"$revision"*) ;; *) exit 1 ;; esac
          "$binary" --licenses > "$RUNNER_TEMP/ssjack-licenses.txt"
          grep -F 'MIT OR Apache-2.0' "$RUNNER_TEMP/ssjack-licenses.txt"
          grep -F 'The Ktav contributors' "$RUNNER_TEMP/ssjack-licenses.txt"
          grep -F 'The Go Authors' "$RUNNER_TEMP/ssjack-licenses.txt"
          mkdir -p "$RUNNER_TEMP/source-install"
          GOBIN="$RUNNER_TEMP/source-install" go install -mod=readonly ./cmd/ssjack
          "$RUNNER_TEMP/source-install/ssjack$suffix" --licenses > "$RUNNER_TEMP/source-install-licenses.txt"
          grep -F 'MIT OR Apache-2.0' "$RUNNER_TEMP/source-install-licenses.txt"
      - name: Test
        run: go test -mod=readonly -count=1 -timeout 180s . ./cmd/ssjack ./internal/... ./plugins/ssjack-ui
      - name: Repeat SSH cancellation regression
        run: go test -mod=readonly -run '^TestInteractiveShellCancellation$' -count=25 -timeout 60s ./internal/remote
      - name: Build installer fixture
        shell: bash
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/ssjack-install-fixture$suffix" ./tests/fixtures/installbinary
      - name: Test Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: bash tests/installers.sh "$RUNNER_TEMP/ssjack-install-fixture"
      - name: Test Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\installers.ps1 -Fixture (Join-Path $env:RUNNER_TEMP 'ssjack-install-fixture.exe')
      - name: Test PowerShell Core installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tests\installers.ps1 -Fixture (Join-Path $env:RUNNER_TEMP 'ssjack-install-fixture.exe')
      - name: Check Bash syntax
        shell: bash
        run: bash -n install.sh tests/installers.sh tests/installers-local.sh
      - name: Retain verified native CLI
        uses: actions/upload-artifact@v4
        with:
          name: verified-cli-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/ssjack${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7

  licenses:
    name: License policy audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify CI selection regressions
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Exercise fail-closed audit rejection cases
        run: python3 -m unittest discover -s scripts -p 'test_check_licenses.py'
      - name: Check exact release dependency and notice policy (factual source consistency only)
        run: python3 scripts/check_licenses.py

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector
        env:
          CGO_ENABLED: '1'
        run: go test -mod=readonly -race -count=1 -timeout 180s . ./cmd/ssjack ./internal/... ./plugins/ssjack-ui

  scoped-appstore:
    name: Scoped app-store CLI acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run scoped CLI acceptance with private overlay
        env:
          CGO_ENABLED: '1'
        run: python3 scripts/ci/appstore_scoped.py

  delivery-root:
    name: Root confidential-delivery acceptance
    runs-on: ubuntu-latest
    container:
      image: golang:1.26.0
      options: --user 0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Python for scoped runner
        run: |
          apt-get update
          apt-get install -y python3
      - name: Public confidential-delivery acceptance
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci/delivery_scoped.py

  full-profile:
    name: Encrypted vault with production 1 GiB KDF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify production vault and app-store master profiles
        env:
          CGO_ENABLED: '0'
          SSJACK_TEST_FULL_KDF: '1'
        run: go test -mod=readonly -p 1 -run '^(TestVault.*FullProfile|TestKeyfileFullProfile|TestAppstoreMasterFullProfile|TestAppstoreFullProfileCLI)$' -count=1 -timeout 600s ./internal/vault ./internal/keyfile ./internal/appstorecrypto ./cmd/ssjack
