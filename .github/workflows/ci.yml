name: Full sprint CI

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing ref to verify at sprint completion
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      source_ref:
        description: Existing ref to verify
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        shell: bash
        run: |
          files="$(gofmt -l licenses.go licenses_test.go cmd internal plugins/ssjack-ui tests/fixtures)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Build CLI and check help
        shell: bash
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          binary="$RUNNER_TEMP/ssjack$suffix"
          revision="$(git rev-parse HEAD)"
          go build -mod=readonly -trimpath -ldflags "-X github.com/PHPCraftdream/ssjack/internal/buildinfo.Commit=$revision" -o "$binary" ./cmd/ssjack
          "$binary" --help
          identity="$("$binary" --version)"
          echo "$identity"
          case "$identity" in *"$revision"*) ;; *) exit 1 ;; esac
          "$binary" --licenses > "$RUNNER_TEMP/ssjack-licenses.txt"
          grep -F 'MIT OR Apache-2.0' "$RUNNER_TEMP/ssjack-licenses.txt"
          grep -F 'The Ktav contributors' "$RUNNER_TEMP/ssjack-licenses.txt"
          grep -F 'The Go Authors' "$RUNNER_TEMP/ssjack-licenses.txt"
          mkdir -p "$RUNNER_TEMP/source-install"
          GOBIN="$RUNNER_TEMP/source-install" go install -mod=readonly ./cmd/ssjack
          "$RUNNER_TEMP/source-install/ssjack$suffix" --licenses > "$RUNNER_TEMP/source-install-licenses.txt"
          grep -F 'MIT OR Apache-2.0' "$RUNNER_TEMP/source-install-licenses.txt"
      - name: Test
        run: go test -mod=readonly -count=1 -timeout 180s . ./cmd/ssjack ./internal/... ./plugins/ssjack-ui
      - name: Native owner with production KDF
        shell: bash
        env:
          SSJACK_TEST_FULL_KDF: '1'
        run: |
          set -o pipefail
          go test -v -mod=readonly -p 1 -run '^TestNativeOwnerFullProfile$' -count=1 -timeout 600s ./internal/nativeownercheck | tee "$RUNNER_TEMP/native-owner.log"
          grep -q '^--- PASS: TestNativeOwnerFullProfile ' "$RUNNER_TEMP/native-owner.log"
      - name: Native owner CLI helper with production KDF
        shell: bash
        env:
          SSJACK_TEST_FULL_KDF: '1'
        run: |
          set -o pipefail
          go test -v -mod=readonly -p 1 -run '^(TestVaultOwnerControlFullProfile|TestVaultKeeperLifetimeFullProfile)$' -count=1 -timeout 300s ./cmd/ssjack | tee "$RUNNER_TEMP/native-owner-cli.log"
          grep -q '^--- PASS: TestVaultOwnerControlFullProfile ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q '^--- PASS: TestVaultKeeperLifetimeFullProfile ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q '^    --- PASS: TestVaultKeeperLifetimeFullProfile/directory ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q '^    --- PASS: TestVaultKeeperLifetimeFullProfile/legacy ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q '^    --- PASS: TestVaultOwnerControlFullProfile/native-command-helper ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q '^    --- PASS: TestVaultOwnerControlFullProfile/actual-keeper-process ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q -- '--- PASS: TestVaultOwnerControlFullProfile/actual-keeper-process/edit/native-mcp-guard ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q -- '--- PASS: TestVaultOwnerControlFullProfile/actual-keeper-process/restart/native-mcp-guard ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q -- '--- PASS: TestVaultOwnerControlFullProfile/actual-keeper-process/edit/native-interactive-helper ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q -- '--- PASS: TestVaultOwnerControlFullProfile/actual-keeper-process/edit/native-human-ssh ' "$RUNNER_TEMP/native-owner-cli.log"
          grep -q -- '--- PASS: TestVaultOwnerControlFullProfile/actual-keeper-process/edit/native-human-ssh/legacy-writer-refusal ' "$RUNNER_TEMP/native-owner-cli.log"
      - name: Native output-filter bypass with production KDF
        shell: bash
        env:
          SSJACK_TEST_FULL_KDF: '1'
        run: |
          set -o pipefail
          go test -v -mod=readonly -p 1 -run '^TestVaultOutputFilterFullProfile$' -count=1 -timeout 300s ./cmd/ssjack | tee "$RUNNER_TEMP/native-output-filter.log"
          grep -q '^--- PASS: TestVaultOutputFilterFullProfile ' "$RUNNER_TEMP/native-output-filter.log"
          grep -q -- '--- PASS: TestVaultOutputFilterFullProfile/bypass/native-mcp-guard ' "$RUNNER_TEMP/native-output-filter.log"
          grep -q -- '--- PASS: TestVaultOutputFilterFullProfile/bypass/native-human-ssh ' "$RUNNER_TEMP/native-output-filter.log"
      - name: Native selected owner archive with production KDF
        shell: bash
        env:
          SSJACK_TEST_FULL_KDF: '1'
        run: |
          set -o pipefail
          go test -v -mod=readonly -p 1 -run '^TestVaultOwnerArchiveFullProfile$' -count=1 -timeout 600s ./cmd/ssjack | tee "$RUNNER_TEMP/native-owner-archive.log"
          grep -q '^--- PASS: TestVaultOwnerArchiveFullProfile ' "$RUNNER_TEMP/native-owner-archive.log"
      - name: Repeat SSH cancellation regression
        run: go test -mod=readonly -run '^TestInteractiveShellCancellation$' -count=25 -timeout 60s ./internal/remote
      - name: Build and install source on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh ./build.sh --install-dir "$RUNNER_TEMP/native source install"
          identity="$("$RUNNER_TEMP/native source install/ssjack" --version)"
          printf '%s\n' "$identity"
          case "$identity" in *"$(git rev-parse HEAD)"*) ;; *) exit 1 ;; esac
      - name: Build and install source with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'native source install classic'
          .\build.ps1 -InstallDir $prefix -NoPathUpdate
          $identity = & (Join-Path $prefix 'ssjack.exe') --version
          if ($LASTEXITCODE -ne 0 -or $identity -notlike "*$(git rev-parse HEAD)*") { throw 'Source install identity mismatch' }
      - name: Build and install source with PowerShell Core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'native source install core'
          .\build.ps1 -InstallDir $prefix -NoPathUpdate
          $identity = & (Join-Path $prefix 'ssjack.exe') --version
          if ($LASTEXITCODE -ne 0 -or $identity -notlike "*$(git rev-parse HEAD)*") { throw 'Source install identity mismatch' }
      - name: Build installer fixture
        shell: bash
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/ssjack-install-fixture$suffix" ./tests/fixtures/installbinary
      - name: Test Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: bash tests/installers.sh "$RUNNER_TEMP/ssjack-install-fixture"
      - name: Test Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\installers.ps1 -Fixture (Join-Path $env:RUNNER_TEMP 'ssjack-install-fixture.exe')
      - name: Test PowerShell Core installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tests\installers.ps1 -Fixture (Join-Path $env:RUNNER_TEMP 'ssjack-install-fixture.exe')
      - name: Check Bash syntax
        shell: bash
        run: bash -n install.sh build.sh tests/installers.sh tests/installers-local.sh
      - name: Retain verified native CLI
        uses: actions/upload-artifact@v4
        with:
          name: verified-cli-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/ssjack${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7

  licenses:
    name: License policy audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify CI selection regressions
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Exercise fail-closed audit rejection cases
        run: python3 -m unittest discover -s scripts -p 'test_check_licenses.py'
      - name: Check exact release dependency and notice policy (factual source consistency only)
        run: python3 scripts/check_licenses.py

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector
        env:
          CGO_ENABLED: '1'
        run: go test -mod=readonly -race -count=1 -timeout 180s . ./cmd/ssjack ./internal/... ./plugins/ssjack-ui

  scoped-appstore:
    name: Scoped app-store CLI acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run scoped CLI acceptance with private overlay
        env:
          CGO_ENABLED: '1'
        run: python3 scripts/ci/appstore_scoped.py

  delivery-root:
    name: Root confidential-delivery acceptance
    runs-on: ubuntu-latest
    container:
      image: golang:1.26.0
      options: --user 0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Python for scoped runner
        run: |
          apt-get update
          apt-get install -y python3
      - name: Public confidential-delivery acceptance
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci/delivery_scoped.py
      - name: Connected text-adapter acceptance
        run: python3 scripts/ci/text_adapter_scoped.py

  full-profile:
    name: Encrypted vault with production 1 GiB KDF
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare terminal acceptance driver
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
      - name: Verify production vault and app-store master profiles
        env:
          CGO_ENABLED: '0'
          SSJACK_TEST_FULL_KDF: '1'
        run: |
          set -o pipefail
          tmux -V
          go test -v -mod=readonly -p 1 -run '^(TestVault.*FullProfile|TestKeyfileFullProfile|TestAppstoreMasterFullProfile|TestAppstoreFullProfileCLI|TestOwnerPacketFullProfile)$' -count=1 -timeout 1200s ./internal/vault ./internal/keyfile ./internal/appstorecrypto ./internal/ownerpacket ./cmd/ssjack | tee "$RUNNER_TEMP/full-profile.log"
          for name in TestVaultOutputFilterFullProfile TestVaultStartupPasswordFullProfile TestVaultKeeperLifetimeFullProfile TestVaultLegacyWriterFullProfile TestVaultOwnerControlFullProfile TestVaultOwnerArchiveFullProfile TestVaultTextOwnerFullProfile TestVaultRemoteMCPStartupFullProfile TestOwnerPacketFullProfile TestVaultDirectoryFullProfile TestVaultProxyFullProfile TestVaultRemoteMCPCaptureFullProfile TestKeyfileFullProfile TestAppstoreMasterFullProfile TestAppstoreFullProfileCLI; do
            grep -q "^--- PASS: $name " "$RUNNER_TEMP/full-profile.log" || { echo "Mandatory full-profile acceptance did not report PASS: $name"; exit 1; }
          done
          for name in continue receipt-remembered empty no-record absent-directory cancel esc ctrl-c stale-ciphertext mcp-nonterminal-refusal issue-refusal prepared-launch-no-output-filter; do
            grep -q -- "--- PASS: TestVaultRemoteMCPStartupFullProfile/$name " "$RUNNER_TEMP/full-profile.log" || { echo "Mandatory remote MCP startup full-profile acceptance did not report PASS: $name"; exit 1; }
          done

  text-pair:
    uses: ./.github/workflows/text-pair.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}
